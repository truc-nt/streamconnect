apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: gcr.io/fabled-ray-438118-j4/gateway
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: 172.21.144.3
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              value: "1234"